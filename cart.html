<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Cart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>
<body>

    <nav>
        <a href="index.html" class="logo"><span>E</span>commerce.</a>

        <a href="cart.html" class="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span class="cart-item-count"></span>
        </a>
    </nav>

    <div class="cart">
        <div class="cart-header">
            <span>Product</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Total</span>
            <span>Remove</span>
        </div>

        <div class="cart-items">
            <div class="cart-item">
                <div class="product">
                    <img src="images/product1_green_1.jpg" alt="">
                    <div class="item-detail">
                        <p>Men Casual Round Neck T-Shirt</p>
                        <div class="size-color-box">
                            <span class="size">L</span>
                            <span class="Color">Green</span>
                        </div>
                    </div>
                </div>
                <span class="price">Rwf 25,000</span>
                <div class="quantity"><input type="number" value="1" min="1"></div>
                <span class="total-price">Rwf 25,000</span>
                <button class="remove"><i class="ri-file-close-fill"></i></button>
            </div>
        </div>
        <div class="cart-total">
            <h3>Cart total</h3>
            <p>Sub-Total <span class="sub-total">Rwf 0</span></p>
            <p>Delivery fee <span>Free</span></p>
            <p>Grand Total <span class="grand-total">Rwf 0</span></p>
            <button class="btn">Proceed to Checkout</button>
        </div>
    </div>
    



    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
