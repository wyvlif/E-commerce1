<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login for E-commerce</title>
    <link rel="stylesheet" href="login.css">
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="form-box login">
            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" placeholder="username"required>
                    <i class="ri-user-fill"></i>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="password"required>
                    <i class="ri-lock-fill"></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn-login">Login</button>
                <p>or login with social platform</p>
                <div class="social-icons">
                    <a href="#"><i class="ri-google-fill"></i></a>
                    <a href="#"><i class="ri-facebook-fill"></i></a>
                    <a href="#"><i class="ri-github-fill"></i></a>
                    <a href="#"><i class="ri-linkedin-box-fill"></i></a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form action="">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" placeholder="username"required>
                    <i class="ri-user-fill"></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Your Email"required>
                    <i class="ri-mail-fill"></i>
                </div>
                <div class="input-box">
                    <input type="text" placeholder="password"required>
                    <i class="ri-lock-fill"></i>
                </div>
                <button type="submit" class="btn-login">Registration</button>
                <p>or registration with social platform</p>
                <div class="social-icons">
                    <a href="#"><i class="ri-google-fill"></i></a>
                    <a href="#"><i class="ri-facebook-fill"></i></a>
                    <a href="#"><i class="ri-github-fill"></i></a>
                    <a href="#"><i class="ri-linkedin-box-fill"></i></a>
                </div>
            </form>
        </div>
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button class="btn register-btn" id="register">Register</button>
            </div>
            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button class="btn login-btn" id="login">Login</button>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
    
</body>
</html>
